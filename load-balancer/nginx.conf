# Velora Production Nginx Load Balancer Configuration
# Handles Round-Robin / IP-Hash load balancing, SSL termination, and WebSocket proxying.

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging format with upstream timing
    log_format upstream_time '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log upstream_time;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json text/plain text/css application/javascript application/x-javascript text/xml application/xml;

    # Upstream Backend Pool (Load Balanced)
    upstream velora_backend_nodes {
        # Sticky session routing so Socket.IO long-polling connects to the same worker
        ip_hash;

        server backend_1:5000 max_fails=3 fail_timeout=10s;
        server backend_2:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 25M;

        # Health Check
        location /health {
            proxy_pass http://velora_backend_nodes/api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket & Socket.IO Proxying
        location /socket.io/ {
            proxy_pass http://velora_backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # REST API Proxying
        location /api/ {
            proxy_pass http://velora_backend_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Static Uploads
        location /uploads/ {
            proxy_pass http://velora_backend_nodes;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }
}
