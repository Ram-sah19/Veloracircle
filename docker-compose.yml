version: '3.8'

services:
  # Nginx Reverse Proxy & Load Balancer
  load_balancer:
    image: nginx:alpine
    container_name: velora_load_balancer
    ports:
      - "80:80"
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_1
      - backend_2
    networks:
      - velora_network
    restart: unless-stopped

  # Backend Worker Node 1
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velora_backend_1
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://redis_cache:6379
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
    depends_on:
      - redis_cache
    networks:
      - velora_network
    restart: unless-stopped

  # Backend Worker Node 2
  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velora_backend_2
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://redis_cache:6379
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
    depends_on:
      - redis_cache
    networks:
      - velora_network
    restart: unless-stopped

  # Redis In-Memory Cache & Message Queue Bus
  redis_cache:
    image: redis:7-alpine
    container_name: velora_redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - velora_network
    restart: unless-stopped

networks:
  velora_network:
    driver: bridge

volumes:
  redis_data:
